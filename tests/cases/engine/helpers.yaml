  - {id: a receipt that is no meal has no open question in a partial context, rule_id: MEAL-01, receipt_id: R1, complete: false, receipts: [{<<: *meal, submitted_expense_type: Lodging, line_items: [{<<: *line, category: lodging}]}], expected: {findings: [], undetermined: []}}
  - id: known food above the cap is a breach, though another line is not known
