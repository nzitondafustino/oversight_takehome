    complete: true
    receipts: [{<<: *meal, submitted_expense_type: Client Entertainment, attendee_count: 2, currency: EUR, fx_rate_to_usd: null, total_amount_usd: null, line_items: [{<<: *line, category: alcohol, unit_price: "65.00", amount: "65.00", amount_usd: "65.00"}, {<<: *line, line_id: L2, category: null, unit_price: "10.00", amount: "10.00", amount_usd: null}]}]
    expected: {findings: [{rule_id: ALC-02, severity: medium, scope: item, receipt_id: R1, line_ids: [L1]}], undetermined: [{rule_id: ALC-02, line_id: L2}]}
