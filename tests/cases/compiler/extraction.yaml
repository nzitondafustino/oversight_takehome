suite: extraction

# Rule extraction from the policy documents. Parse step only, no LLM.
#
# documents: everything found in a real file under data/policy-docs/.
#   rule_ids is exact and in order. context_starts gives how each non-rule block begins.
# clauses: one real rule, with every extracted field compared exactly.
#   starts and ends mark where its text begins and stops, with wrapped lines joined.
# inline: the same check as documents, on text written here, for shapes the real
#   files do not all contain. texts gives a clause's exact text, with lines joined,
#   and thresholds its exact thresholds.
# refused: text that must fail, with an error matching the pattern in `expected`.

