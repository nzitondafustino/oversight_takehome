# A developer-authored robustness set. It is not an externally validated or fully independent benchmark:
# its author also wrote the prompt, and knows the benchmark and the taxonomy.
#
# input is all the classifier may read. gold, challenges, ambiguity and explanation are for scoring only.
#
# gold.category   the best single answer, in the taxonomy. Strict accuracy reads this.
# gold.acceptable other defensible categories, on an ambiguous or indeterminate line.
# gold.<field>    an attribute that should be read. A field not named should be null, unless in unlabelled.
# gold.unlabelled fields where null and a value are both defensible, so they are not scored.
# ambiguity       clear, ambiguous (more than one defensible reading), or indeterminate (the line cannot say).
#                 An indeterminate line has gold `other`: the taxonomy's answer to an item nothing identifies.

