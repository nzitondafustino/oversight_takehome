  - {id: a missing category leaves the spend unknown, rule_id: MEAL-01, receipt_id: R1, complete: true, receipts: [{<<: *meal, line_items: [{<<: *line, category: null}]}], expected: {findings: [], undetermined: [{rule_id: MEAL-01, line_id: null}]}}
