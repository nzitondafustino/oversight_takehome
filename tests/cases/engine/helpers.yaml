contexts:
  - {id: receipts are held in id order, customer_id: northwind, complete: true, receipts: [{<<: *meal, receipt_id: R2}, {<<: *meal, receipt_id: R1}], expected: {receipt_ids: [R1, R2], complete: true}}
  - {id: a repeat counts once, customer_id: northwind, complete: true, receipts: [*meal, *meal], expected: {receipt_ids: [R1], complete: true}}
  - {id: a partial context says so, customer_id: northwind, complete: false, receipts: [*meal], expected: {receipt_ids: [R1], complete: false}}
  - {id: an empty context is allowed, customer_id: northwind, complete: true, receipts: [], expected: {receipt_ids: [], complete: true}}
  - {id: an entity is derived on the way in, customer_id: northwind, complete: true, receipts: [{<<: *meal, employee_country: IN}], expected: {receipt_ids: [R1], complete: true}}

refused:
