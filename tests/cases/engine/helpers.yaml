  - {id: international at its cap, rule_id: MEAL-01, receipt_id: R1, complete: true, receipts: [{<<: *meal, currency: EUR, line_items: [{<<: *line, unit_price: "100.00", amount: "100.00", amount_usd: "100.00"}]}], expected: {findings: [], undetermined: []}}
