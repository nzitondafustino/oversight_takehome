    expected: {findings: [], undetermined: []}
  - {id: not a meal, rule_id: MEAL-01, receipt_id: R1, complete: true, receipts: [{<<: *meal, submitted_expense_type: Lodging, line_items: [{<<: *line, category: lodging, unit_price: "500.00", amount: "500.00", amount_usd: "500.00"}]}], expected: {findings: [], undetermined: []}}
  - {id: divided by the attendee count, rule_id: MEAL-01, receipt_id: R1, complete: true, receipts: [{<<: *meal, attendee_count: 4, line_items: [{<<: *line, unit_price: "300.00", amount: "300.00", amount_usd: "300.00"}]}], expected: {findings: [], undetermined: []}}
