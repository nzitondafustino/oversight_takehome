  - {id: a date with no time, customer_id: northwind, complete: true, receipts: [{<<: *meal, transaction_datetime: "2026-04-14"}], expected: needs a time}
  - {id: no customer, customer_id: "  ", complete: true, receipts: [*meal], expected: a receipt context needs a customer_id}

