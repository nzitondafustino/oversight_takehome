# Part 4. Each ladder changes one amount. statuses is the rule's status at each step, from the bound.
ladders:
  - id: a higher uncertain charge on a meal under the cap never confirms a breach
    rule: MEAL-01
    vary: {receipt_id: R1, line_id: L9}
    amounts: ["0.01", "4.99", "5.00", "5.01", "50.00"]
    complete: true
    receipts: [{<<: *meal, line_items: [*food_70, *unknown]}]
    expected: {statuses: [undetermined, undetermined, undetermined, undetermined, undetermined]}
  - id: a higher uncertain charge beside alcohol under the cap never confirms a breach
    rule: ALC-02
    vary: {receipt_id: R1, line_id: L9}
    amounts: ["1.00", "20.00", "20.01", "50.00"]
    complete: true
    receipts: [{<<: *entertainment, line_items: [*alcohol_40, *unknown]}]
    expected: {statuses: [compliant, compliant, undetermined, undetermined]}
  - id: a higher uncertain charge beside medication under the cap never confirms a breach
    rule: HEALTH-01
    vary: {receipt_id: R1, line_id: L9}
    amounts: ["1.00", "5.00", "5.01", "50.00"]
    complete: true
    receipts: [{<<: *travel, line_items: [*otc_20, *unknown]}]
    expected: {statuses: [compliant, compliant, undetermined, undetermined]}
  - id: a deeper uncertain discount on a meal over the cap
    rule: MEAL-01
    vary: {receipt_id: R1, line_id: L9}
    amounts: ["-1.00", "-4.99", "-5.00", "-10.00", "-50.00"]
    complete: true
    receipts: [{<<: *meal, line_items: [*food_80, *unknown]}]
    expected: {statuses: [confirmed, confirmed, undetermined, undetermined, undetermined]}
  - id: a deeper uncertain discount on alcohol over the cap
    rule: ALC-02
    vary: {receipt_id: R1, line_id: L9}
    amounts: ["-1.00", "-4.99", "-5.00", "-10.00", "-50.00"]
    complete: true
    receipts: [{<<: *entertainment, line_items: [*alcohol_65, *unknown]}]
    expected: {statuses: [confirmed, confirmed, undetermined, undetermined, undetermined]}
  - id: a deeper uncertain discount on a gift over the cap
    rule: GIFT-01
    vary: {receipt_id: R1, line_id: L9}
    amounts: ["-1.00", "-4.99", "-5.00", "-10.00", "-50.00"]
    complete: true
    receipts: [{<<: *gifts, line_items: [*gift_55_a, *unknown_for_a]}]
    expected: {statuses: [confirmed, confirmed, undetermined, undetermined, undetermined]}
  - id: a deeper uncertain discount on medication over the cap
    rule: HEALTH-01
    vary: {receipt_id: R1, line_id: L9}
    amounts: ["-1.00", "-4.99", "-5.00", "-10.00", "-50.00"]
    complete: true
    receipts: [{<<: *travel, line_items: [*otc_30, *unknown]}]
    expected: {statuses: [confirmed, confirmed, undetermined, undetermined, undetermined]}
  - id: a deeper uncertain discount on baggage essentials over the allowance
    rule: PERS-02
    vary: {receipt_id: R1, line_id: L9}
    amounts: ["-1.00", "-4.99", "-5.00", "-10.00", "-50.00"]
    complete: true
    receipts: [{<<: *delayed, line_items: [*clothing_155, *unknown]}]
    expected: {statuses: [confirmed, confirmed, undetermined, undetermined, undetermined]}

# The one bound the engine works out as a number today. least and most are per person, at each step.
spend_bounds:
  - id: a higher uncertain charge raises the most and leaves the least
    vary: {receipt_id: R1, line_id: L9}
    amounts: ["0.01", "5.00", "50.00"]
    receipts: [{<<: *meal, line_items: [*food_70, *unknown]}]
    expected: {least: ["70", "70", "70"], most: ["70.01", "75", "120"]}
  - id: a deeper uncertain discount lowers the least and leaves the most
    vary: {receipt_id: R1, line_id: L9}
    amounts: ["-0.01", "-5.00", "-50.00"]
    receipts: [{<<: *meal, line_items: [*food_80, *unknown]}]
    expected: {least: ["79.99", "75", "30"], most: ["80", "80", "80"]}
  - id: per person, with attendees
    vary: {receipt_id: R1, line_id: L9}
    amounts: ["-10.00", "10.00"]
    receipts: [{<<: *meal, attendee_count: 2, line_items: [*food_80, *unknown]}]
    expected: {least: ["35", "40"], most: ["40", "45"]}
  - id: a known discount outside meal spend moves neither bound, whatever its size
    vary: {receipt_id: R1, line_id: L9}
    amounts: ["-1.00", "-50.00"]
    receipts: [{<<: *meal, line_items: [*food_80, {<<: *unknown, category: gift}]}]
    expected: {least: ["80", "80"], most: ["80", "80"]}

