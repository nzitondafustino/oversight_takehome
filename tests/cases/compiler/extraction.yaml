inline:
  - id: a heading ends a clause
    text: |
      # Doc

      **AA-01 — One.** First clause.

      ## Next

      Plain prose after the heading.
    expected:
      title: Doc
      rule_ids: [AA-01]
      context_starts: ["Plain prose"]
      texts: {AA-01: "First clause."}

  - id: a bold note ends a clause
    text: |
      **AA-01 — One.** First clause.

      **Note on something.** Not a rule.
    expected:
      title: null
      rule_ids: [AA-01]
      context_starts: ["**Note on something.**"]
      texts: {AA-01: "First clause."}

  - id: a bold note inside a paragraph does not end a clause
    text: |
      **AA-01 — One.** First clause
      **Not a new paragraph.** Still the clause.
    expected:
      title: null
      rule_ids: [AA-01]
      context_starts: []
      texts: {AA-01: "First clause **Not a new paragraph.** Still the clause."}

  - id: bold at the start of a wrapped line does not end a clause
    text: |
      **AA-01 — One.** This is a

      **high** exception.
    expected:
      title: null
      rule_ids: [AA-01]
      context_starts: []
      texts: {AA-01: "This is a **high** exception."}

  - id: an italic paragraph stays in its clause
    text: |
      **AA-01 — One.** First clause.

      *Some exception.* It still belongs here.

      **AA-02 — Two.** Second clause.
    expected:
      title: null
      rule_ids: [AA-01, AA-02]
      context_starts: []
      texts:
        AA-01: "First clause. *Some exception.* It still belongs here."
        AA-02: "Second clause."

  - id: a rule ID in prose is not a clause
    text: |
      # Doc

      See MCC-01 and **MCC-02** for more.
    expected:
      title: Doc
      rule_ids: []
      context_starts: ["See MCC-01"]

  - id: a full stop inside a title
    text: |
      **AA-01 — Cap of $1.50 per item.** First clause.
    expected:
      title: null
      rule_ids: [AA-01]
      context_starts: []
      texts: {AA-01: "First clause."}

  - id: a heading with no text after it
    text: |
      **AA-01 — One.**
    expected:
      title: null
      rule_ids: [AA-01]
      context_starts: []
      texts: {AA-01: ""}

  - id: windows line endings
    text: "# Doc\r\n\r\n**AA-01 — One.** First\r\nclause.\r\n"
    expected:
      title: Doc
      rule_ids: [AA-01]
      context_starts: []
      texts: {AA-01: "First clause."}

  - id: an empty document
    text: ""
    expected:
      title: null
      rule_ids: []
      context_starts: []

  - id: bold ending in a full stop later in the line is not the title
    text: |
      **AA-01 — One.** It is **never allowed.** No exceptions.
    expected:
      title: null
      rule_ids: [AA-01]
      context_starts: []
      texts: {AA-01: "It is **never allowed.** No exceptions."}

  - id: only the first top-level heading is the title
    text: |
      # First

      # Second

      **AA-01 — One.** First clause.
    expected:
      title: First
      rule_ids: [AA-01]
      context_starts: []

  - id: thresholds keep their order across currencies, with decimals and commas
    text: |
      **AA-01 — One.** Above EUR 50, or $20, or $1,500.50, or $20 again.
    expected:
      title: null
      rule_ids: [AA-01]
      context_starts: []
      thresholds:
        AA-01:
          - {value: "50", unit: eur}
          - {value: "20", unit: usd}
          - {value: "1500.50", unit: usd}

  - id: thresholds written with digits and in the singular
    text: |
      **AA-01 — One.** At least 3 nights, or 1 hour, or 1 night, or 2 or more receipts.
    expected:
      title: null
      rule_ids: [AA-01]
      context_starts: []
      thresholds:
        AA-01:
          - {value: "3", unit: nights}
          - {value: "1", unit: hour}
          - {value: "1", unit: nights}
          - {value: "2", unit: count}

  - id: other numbers are not thresholds
    text: |
      **AA-01 — One.** Two items, on 3 receipts, over nine days, at most once.
    expected:
      title: null
      rule_ids: [AA-01]
      context_starts: []
      thresholds: {AA-01: []}

refused:
  - id: heading with a hyphen instead of a dash
    text: "**AA-01 - One.** First clause."
    expected: "doc.md:1: malformed rule heading"

  - id: heading with a colon
    text: "# Doc\n\n**AA-01: One.** First clause."
    expected: "doc.md:3: malformed rule heading"

  - id: heading without its closing full stop
    text: "**AA-01 — One** First clause."
    expected: malformed rule heading

  - id: rule number with one digit
    text: "**AA-1 — One.** First clause."
    expected: malformed rule heading

  - id: duplicate rule ID
    text: "**AA-01 — One.** First.\n\n**AA-01 — Again.** Second."
    expected: "duplicate rule ids: \\['AA-01'\\]"
