[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "expense-policy-validator-api"  # the import name is expense_api
version = "0.1.0"
description = "REST API around the Expense Policy Validator: rulesets, synchronous validation and persisted runs."
requires-python = ">=3.12"
dependencies = [
    # The core library, installed from the parent folder in the same pip command (see README.md). It is not
    # published to an index, so never let pip resolve this name from one.
    "expense-policy-validator[langgraph]==0.1.0",
    "boto3>=1.35,<2",  # policy document contents in Amazon S3
    "fastapi>=0.115,<1",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.4,<3",
    "pymongo>=4.9,<5",
    "python-multipart>=0.0.9,<1",  # multipart uploads of evaluation datasets
    "pyyaml>=6,<7",  # YAML datasets, read with a restricted safe loader
    "uvicorn>=0.30,<1",
    "reportlab>=4.2,<5",  # saved validation/evaluation PDF reports; bundled fonts, no external assets
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "httpx>=0.28,<1", "mongomock>=4.3,<5", "moto[s3]>=5.0,<6", "pypdf>=5,<7"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["expense_api*"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
