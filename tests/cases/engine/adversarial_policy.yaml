    expected: R1. appears twice with different contents

# Each run stands alone: run in either order, and neither sees the other's receipts.
separate_runs:
  - id: one receipt ID with different contents for two customers
    runs:
      northwind: [{<<: *retail, line_items: [*tobacco]}]
      southwind: [{<<: *computer, pre_approval_ref: PA-1, line_items: [*monitor]}]
    expected:
      northwind: {R1: {disposition: flag, active: [DOC-03, PERS-03]}}
      southwind: {R1: {disposition: pass, active: [], audit: [{rule_id: TECH-02, resolution: waived}]}}
  - id: an allowance is not shared across customers with the same employee and reference
    runs:
      northwind: [{<<: *delayed, line_items: [*clothing_100]}]
      southwind: [{<<: *delayed, line_items: [*clothing_100]}]
    expected:
      northwind: {R1: {disposition: pass, active: []}}
      southwind: {R1: {disposition: pass, active: []}}
  - id: a trip total is not shared across customers
    runs:
      northwind: [{<<: *travel, line_items: [*otc_20]}]
      southwind: [{<<: *travel, line_items: [*otc_20]}]
    expected:
      northwind: {R1: {disposition: pass, active: []}}
