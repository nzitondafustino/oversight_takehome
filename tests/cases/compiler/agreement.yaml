suite: agreement

# The regex reading of `text` against a recorded LLM reading in `response`. No API calls.
#
# cases:   expected lists each rule with the fields that did not agree, by status.
#          {} means every field agreed. only_regex or only_llm means one reading missed the rule.
# refused: an LLM response that must be rejected, with an error matching `expected`.

templates:
  text: &text "## Limits\n\n**AA-01 — One.** Up to **$200** per item, or a **high** exception (see BB-02).\n"

  rule: &rule
    rule_id: AA-01
    title: One
    section: Limits
    severities: [high]
    review_signal: false
    thresholds: [{value: "200", unit: usd}]
    references: [BB-02]
    quote: "per item"

cases:
  - id: every field agrees
    text: *text
    response: {rules: [*rule]}
    expected: {AA-01: {}}

  - id: a different severity
    text: *text
    response:
      rules:
        - {<<: *rule, severities: [low]}
    expected: {AA-01: {disagree: [severities]}}

  - id: a different number
    text: *text
    response:
      rules:
        - {<<: *rule, thresholds: [{value: "250", unit: usd}]}
    expected: {AA-01: {disagree: [thresholds]}}

  - id: the same number in a different unit
    text: *text
    response:
      rules:
        - {<<: *rule, thresholds: [{value: "200", unit: eur}]}
    expected: {AA-01: {disagree: [thresholds]}}

  - id: the same number written differently
    text: *text
    response:
      rules:
        - {<<: *rule, thresholds: [{value: "200.00", unit: usd}]}
    expected: {AA-01: {}}

  - id: a number only the LLM found
    text: *text
    response:
      rules:
        - {<<: *rule, thresholds: [{value: "200", unit: usd}, {value: "5", unit: nights}]}
    expected: {AA-01: {disagree: [thresholds]}}

  - id: a different title
    text: *text
    response:
      rules:
        - {<<: *rule, title: Other}
    expected: {AA-01: {disagree: [title]}}

  - id: a title with its full stop still agrees
    text: *text
    response:
      rules:
        - {<<: *rule, title: One.}
    expected: {AA-01: {}}

  - id: a different section
    text: *text
    response:
      rules:
        - {<<: *rule, section: null}
    expected: {AA-01: {disagree: [section]}}

  - id: a different review signal
    text: *text
    response:
      rules:
        - {<<: *rule, review_signal: true}
    expected: {AA-01: {disagree: [review_signal]}}

  - id: a different reference
    text: *text
    response:
      rules:
        - {<<: *rule, references: []}
    expected: {AA-01: {disagree: [references]}}

  - id: an invented quote
    text: *text
    response:
      rules:
        - {<<: *rule, quote: "never reimbursable"}
    expected: {AA-01: {disagree: [quote]}}

  - id: a quote without the bold markers still agrees
    text: *text
    response:
      rules:
        - {<<: *rule, quote: "Up to $200 per item"}
    expected: {AA-01: {}}

  - id: several fields can disagree at once
    text: *text
    response:
      rules:
        - {<<: *rule, title: Other, severities: []}
    expected: {AA-01: {disagree: [title, severities]}}

  - id: a rule only the regex found
    text: *text
    response: {rules: []}
    expected: {AA-01: only_regex}

  - id: a rule only the LLM found
    text: *text
    response:
      rules:
        - *rule
        - {<<: *rule, rule_id: CC-03}
    expected: {AA-01: {}, CC-03: only_llm}

  - id: no thresholds on a clause with no numbers agrees
    text: "**AA-01 — One.** Never allowed.\n"
    response:
      rules:
        - {<<: *rule, section: null, severities: [], thresholds: [], references: [], quote: "Never allowed"}
    expected: {AA-01: {}}

  - id: no thresholds on a clause with a number is unconfirmed
    text: "**AA-01 — One.** Within 30 days.\n"
    response:
      rules:
        - {<<: *rule, section: null, severities: [], thresholds: [], references: [], quote: "Within"}
    expected: {AA-01: {unconfirmed: [thresholds]}}

  - id: no thresholds on a clause with a number word is unconfirmed
    text: "**AA-01 — One.** Within three days.\n"
    response:
      rules:
        - {<<: *rule, section: null, severities: [], thresholds: [], references: [], quote: "Within"}
    expected: {AA-01: {unconfirmed: [thresholds]}}

  - id: a number the regex cannot read but the LLM can is a disagreement
    text: "**AA-01 — One.** Within 30 days.\n"
    response:
      rules:
        - {<<: *rule, section: null, severities: [], thresholds: [{value: "30", unit: count}], references: [], quote: "Within"}
    expected: {AA-01: {disagree: [thresholds]}}

  - id: a mention of another rule is not a number
    text: "**AA-01 — One.** See BB-02.\n"
    response:
      rules:
        - {<<: *rule, section: null, severities: [], thresholds: [], quote: "See"}
    expected: {AA-01: {}}

  - id: a response in a code fence is still read
    text: *text
    response: "```json\n{\"rules\": []}\n```"
    expected: {AA-01: only_regex}

refused:
  - id: not JSON
    response: "I found one rule."
    expected: "Invalid JSON"

  - id: a missing field
    response: '{"rules": [{"rule_id": "AA-01"}]}'
    expected: "title"

  - id: an unknown field
    response: '{"rules": [], "notes": "extra"}'
    expected: "notes"

  - id: an unknown severity
    response: '{"rules": [{"rule_id": "AA-01", "title": "One", "section": null, "severities": ["urgent"], "review_signal": false, "thresholds": [], "references": [], "quote": "q"}]}'
    expected: "severities"

  - id: an unknown unit
    response: '{"rules": [{"rule_id": "AA-01", "title": "One", "section": null, "severities": [], "review_signal": false, "thresholds": [{"value": "1", "unit": "days"}], "references": [], "quote": "q"}]}'
    expected: "unit"

  - id: a repeated rule ID
    response: '{"rules": [{"rule_id": "AA-01", "title": "One", "section": null, "severities": [], "review_signal": false, "thresholds": [], "references": [], "quote": "q"}, {"rule_id": "AA-01", "title": "One", "section": null, "severities": [], "review_signal": false, "thresholds": [], "references": [], "quote": "q"}]}'
    expected: "duplicate rule ids"

# A scenario document in tests/fixtures/policy_scenarios, read by the regex and by its recorded response,
# through the real parse_response and extract_with_llm. expected is as for cases, plus the counts.
recorded:
  - {id: every field agrees, scenario: agree, expected: {rules: {ZZ-01: {}}, counts: {agreed: 7, disagree: 0, unconfirmed: 0, only_regex: 0, only_llm: 0}}}
  - {id: a different threshold, scenario: threshold_conflict, expected: {rules: {ZZ-01: {disagree: [thresholds]}}, counts: {agreed: 6, disagree: 1, unconfirmed: 0, only_regex: 0, only_llm: 0}}}
  - {id: a different severity, scenario: severity_conflict, expected: {rules: {ZZ-01: {disagree: [severities]}}, counts: {agreed: 6, disagree: 1, unconfirmed: 0, only_regex: 0, only_llm: 0}}}
  - {id: a rule only the regex found, scenario: llm_missed_a_rule, expected: {rules: {ZZ-01: {}, ZZ-02: only_regex}, counts: {agreed: 7, disagree: 0, unconfirmed: 0, only_regex: 1, only_llm: 0}}}
  - {id: a rule only the LLM found, scenario: llm_added_a_rule, expected: {rules: {ZZ-01: {}, ZZ-09: only_llm}, counts: {agreed: 7, disagree: 0, unconfirmed: 0, only_regex: 0, only_llm: 1}}}
  - {id: a quote that is not in the clause, scenario: fabricated_quote, expected: {rules: {ZZ-01: {disagree: [quote]}}, counts: {agreed: 6, disagree: 1, unconfirmed: 0, only_regex: 0, only_llm: 0}}}
  - {id: both readings missed a number in the text, scenario: both_missed_a_number, expected: {rules: {ZZ-01: {unconfirmed: [thresholds]}}, counts: {agreed: 6, disagree: 0, unconfirmed: 1, only_regex: 0, only_llm: 0}}}

recorded_refused:
  - {id: a malformed recorded response, scenario: malformed, expected: "Invalid JSON"}
  - {id: a document with no recording, scenario: no_recording, expected: "no recorded response for the document with sha256"}

# Reviewer resolutions on a scenario's results. A resolution names its rule (ZZ-01 unless given), field and
# value. Its clause hash is the result's own, unless `clause_hash: stale` gives one from an older clause.
# expected: the results resolved and still unresolved, as "rule_id field", and a regex for each refusal.
resolutions:
  - id: the regex value settles a threshold disagreement
    scenario: threshold_conflict
    resolutions: [{field: thresholds, value: [{value: "200", unit: usd}]}]
    expected: {resolved: [ZZ-01 thresholds], unresolved: [], errors: []}
  - id: the same number written another way is accepted
    scenario: threshold_conflict
    resolutions: [{field: thresholds, value: [{value: "200.00", unit: usd}]}]
    expected: {resolved: [ZZ-01 thresholds], unresolved: [], errors: []}
  - id: the LLM's number is refused when the text does not state it
    scenario: threshold_conflict
    resolutions: [{field: thresholds, value: [{value: "250", unit: usd}]}]
    expected: {resolved: [], unresolved: [ZZ-01 thresholds], errors: ["does not state the number 250"]}
  - id: a threshold with a unit outside the vocabulary is refused
    scenario: threshold_conflict
    resolutions: [{field: thresholds, value: [{value: "200", unit: days}]}]
    expected: {resolved: [], unresolved: [ZZ-01 thresholds], errors: ["unit from"]}
  - id: a threshold that is not a list is refused
    scenario: threshold_conflict
    resolutions: [{field: thresholds, value: "200"}]
    expected: {resolved: [], unresolved: [ZZ-01 thresholds], errors: ["must be a list"]}
  - id: the severity the clause states settles a severity disagreement
    scenario: severity_conflict
    resolutions: [{field: severities, value: [medium]}]
    expected: {resolved: [ZZ-01 severities], unresolved: [], errors: []}
  - id: the LLM's severity is refused when the clause does not state it
    scenario: severity_conflict
    resolutions: [{field: severities, value: [high]}]
    expected: {resolved: [], unresolved: [ZZ-01 severities], errors: ["does not state \\['high'\\]"]}
  - id: a severity outside the vocabulary is refused
    scenario: severity_conflict
    resolutions: [{field: severities, value: [urgent]}]
    expected: {resolved: [], unresolved: [ZZ-01 severities], errors: ["drawn from"]}
  - id: a rule only the regex found is confirmed present
    scenario: llm_missed_a_rule
    resolutions: [{rule_id: ZZ-02, field: rule, value: present}]
    expected: {resolved: [ZZ-02 rule], unresolved: [], errors: []}
  - id: a rule with a heading cannot be called absent
    scenario: llm_missed_a_rule
    resolutions: [{rule_id: ZZ-02, field: rule, value: absent}]
    expected: {resolved: [], unresolved: [ZZ-02 rule], errors: ["has a heading for this rule"]}
  - id: a rule only the LLM found is confirmed absent
    scenario: llm_added_a_rule
    resolutions: [{rule_id: ZZ-09, field: rule, value: absent}]
    expected: {resolved: [ZZ-09 rule], unresolved: [], errors: []}
  - id: a rule with no heading cannot be called present
    scenario: llm_added_a_rule
    resolutions: [{rule_id: ZZ-09, field: rule, value: present}]
    expected: {resolved: [], unresolved: [ZZ-09 rule], errors: ["no heading for this rule"]}
  - id: a corrected quote from the clause settles a fabricated one
    scenario: fabricated_quote
    resolutions: [{field: quote, value: capped at $200 per item}]
    expected: {resolved: [ZZ-01 quote], unresolved: [], errors: []}
  - id: keeping the fabricated quote is refused
    scenario: fabricated_quote
    resolutions: [{field: quote, value: always reimbursable with approval}]
    expected: {resolved: [], unresolved: [ZZ-01 quote], errors: ["must be in the clause"]}
  - id: no threshold settles a number that is not a limit
    scenario: both_missed_a_number
    resolutions: [{field: thresholds, value: []}]
    expected: {resolved: [ZZ-01 thresholds], unresolved: [], errors: []}
  - id: a resolution for a clause that has since changed is stale
    scenario: threshold_conflict
    resolutions: [{field: thresholds, value: [{value: "200", unit: usd}], clause_hash: stale}]
    expected: {resolved: [], unresolved: [ZZ-01 thresholds], errors: ["stale"]}
  - id: a resolution for an agreed field is refused
    scenario: threshold_conflict
    resolutions: [{field: title, value: Peripheral cap}]
    expected: {resolved: [], unresolved: [ZZ-01 thresholds], errors: ["no unresolved result"]}
  - id: a field that cannot be resolved is refused
    scenario: threshold_conflict
    resolutions: [{field: colour, value: red}]
    expected: {resolved: [], unresolved: [ZZ-01 thresholds], errors: ["no unresolved result"]}
  - id: a second resolution for the same result is refused
    scenario: threshold_conflict
    resolutions: [{field: thresholds, value: [{value: "200", unit: usd}]}, {field: thresholds, value: [{value: "200", unit: usd}]}]
    expected: {resolved: [ZZ-01 thresholds], unresolved: [], errors: ["resolved more than once"]}
  - id: a stated number in another unit is refused
    scenario: threshold_conflict
    resolutions: [{field: thresholds, value: [{value: "200", unit: count}]}]
    expected: {resolved: [], unresolved: [ZZ-01 thresholds], errors: ["states 200, but not as a limit with unit count. Its limits are: 200 usd"]}
  - id: a number that is not written as a limit is refused
    scenario: both_missed_a_number
    resolutions: [{field: thresholds, value: [{value: "30", unit: count}]}]
    expected: {resolved: [], unresolved: [ZZ-01 thresholds], errors: ["states 30, but not as a limit with unit count. Its limits are: none"]}
