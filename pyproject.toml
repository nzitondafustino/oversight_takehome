[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "expense-policy-validator"
version = "0.1.0"
description = "Classifies expense receipt lines and checks receipts against written expense policy, with evidence."
readme = "docs/API.md"
requires-python = ">=3.12"
keywords = ["expense", "policy", "receipts", "classification"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.28,<1",
    "openrouter==1.3.78",
    "pydantic>=2.9,<3",
    "python-dotenv>=1,<2",
    "pyyaml>=6,<7",
]

[project.optional-dependencies]
api = ["fastapi>=0.110"]  # only for examples/fastapi_app.py
langgraph = ["langgraph==1.2.15"]  # only for classification_backend langgraph: classification/orchestrator.py
dev = ["pytest>=8,<9", "langgraph==1.2.15"]  # the test suite covers the langgraph orchestrator too

# The command lines. Each reads config.yaml, data/ and rules/ from the project folder: the source checkout, or
# EXPENSE_VALIDATOR_ROOT, or the current folder (see expense_validator.config). The python -m commands still work.
[project.scripts]
expense-validator-run = "expense_validator.run_receipts:main"
expense-validator-build-rules = "expense_validator.compiler.build_rules:main"
expense-validator-agreement = "expense_validator.compiler.agreement:main"
expense-validator-eval = "expense_validator.evaluation.cli.policy:main"
expense-validator-eval-classification = "expense_validator.evaluation.cli.classification:main"
expense-validator-eval-robustness = "expense_validator.evaluation.cli.robustness:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["expense_validator*"]

[tool.setuptools.package-data]
expense_validator = ["py.typed"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
