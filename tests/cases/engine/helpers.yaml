suite: helpers

# The named helpers, with the real rules, so the real thresholds, unless a case says otherwise.
#
# outcomes:   run_helper for `rule_id` on `receipt_id`, from a context of `receipts`. `complete`
#             says whether those are all the receipts. expected.findings lists them by rule_id,
#             severity, scope, receipt_id and line_ids, and expected.undetermined by rule_id and line_id.
# details:    the first finding. expected names values in its JSON form.
# runs:       run_checks with only the rules in `rule_ids`, passing the context if `with_context`.
#             expected holds any of findings, pending_helpers, undetermined and complete.
# baggage:    baggage_allowance on `receipt_id`. expected holds line_ids, total_usd and within.
# contexts:   build_context. expected.receipt_ids lists what it holds, in order.
# refused:    build_context or run_helper cannot go ahead. expected is an error regex.
# recipients: what a classifier would read from the three lines in the data that name someone.
#             The gold labels hold only categories, so the helper comparison stands in these.

templates:
  line: &line
    line_id: L1
    description_raw: Grilled salmon
    language: en
    quantity: 1
    unit_price: "40.00"
    amount: "40.00"
    amount_usd: "40.00"
    category: food_beverage
    confidence: "0.9"
  meal: &meal
    receipt_id: R1
    employee_id: E-1
    employee_country: US
    submitted_expense_type: Meals - Individual
    merchant_name: Verona Grill
    mcc: "5812"
    transaction_datetime: "2026-04-14T12:00:00"
    currency: USD
    fx_rate_to_usd: "1"
    total_amount: "40.00"
    total_amount_usd: "40.00"
    itemized: true
    line_items: [*line]
  gifts: &gifts
    <<: *meal
    submitted_expense_type: Client Gifts
    mcc: "5944"
  # $40.00 is 37.04 euros at this rate, to the nearest cent.
  emea: &emea
    <<: *meal
    employee_country: FR
    currency: EUR
    fx_rate_to_usd: "1.08"
    total_amount: "37.04"
    line_items: [{<<: *line, unit_price: "37.04", amount: "37.04"}]

outcomes:
  # meal_cap: MEAL-01, $75 domestic and $100 international, per person per day
  - {id: at the domestic cap, rule_id: MEAL-01, receipt_id: R1, complete: true, receipts: [{<<: *meal, line_items: [{<<: *line, unit_price: "75.00", amount: "75.00", amount_usd: "75.00"}]}], expected: {findings: [], undetermined: []}}
  - id: just above the domestic cap
    rule_id: MEAL-01
    receipt_id: R1
    complete: true
    receipts: [{<<: *meal, line_items: [{<<: *line, unit_price: "75.01", amount: "75.01", amount_usd: "75.01"}]}]
    expected: {findings: [{rule_id: MEAL-01, severity: medium, scope: receipt, receipt_id: R1, line_ids: []}], undetermined: []}
