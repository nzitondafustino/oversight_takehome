# docker compose up --build   (from backend/; settings come from backend/.env, see .env.example)
name: expense-api

# The API and the evaluation worker run the same image with the same settings. Only the API serves HTTP.
x-backend-environment: &backend-environment
  EXPENSE_API_MONGO_URI: mongodb://mongo:27017
  EXPENSE_API_MONGO_DATABASE: ${EXPENSE_API_MONGO_DATABASE:-expense_api}
  EXPENSE_API_DEFAULT_REPLAY_SET: ${EXPENSE_API_DEFAULT_REPLAY_SET:-openrouter}
  EXPENSE_API_ALLOW_LIVE: ${EXPENSE_API_ALLOW_LIVE:-false}
  EXPENSE_API_ALLOW_UNCAPPED_EVALUATIONS: ${EXPENSE_API_ALLOW_UNCAPPED_EVALUATIONS:-false}
  EXPENSE_API_ALLOWED_MODELS: ${EXPENSE_API_ALLOWED_MODELS:-[]}
  # Each role's own allowlist; "null" (unset) uses EXPENSE_API_ALLOWED_MODELS for that role.
  EXPENSE_API_ALLOWED_CLASSIFICATION_MODELS: ${EXPENSE_API_ALLOWED_CLASSIFICATION_MODELS:-null}
  EXPENSE_API_ALLOWED_TRANSLATION_MODELS: ${EXPENSE_API_ALLOWED_TRANSLATION_MODELS:-null}
  EXPENSE_API_LIVE_CACHE_DIR: /var/lib/expense_api/live-cache
  EXPENSE_API_ALLOW_PREVIEW_VALIDATION: ${EXPENSE_API_ALLOW_PREVIEW_VALIDATION:-false}
  EXPENSE_API_ALLOWED_PUBLICATION_MODES: ${EXPENSE_API_ALLOWED_PUBLICATION_MODES:-["production"]}
  EXPENSE_API_MAX_DOCUMENT_BYTES: ${EXPENSE_API_MAX_DOCUMENT_BYTES:-524288}
  EXPENSE_API_MAX_DATASET_BYTES: ${EXPENSE_API_MAX_DATASET_BYTES:-4194304}
  EXPENSE_API_MAX_DATASET_RECEIPTS: ${EXPENSE_API_MAX_DATASET_RECEIPTS:-500}
  EXPENSE_API_WORKER_LEASE_SECONDS: ${EXPENSE_API_WORKER_LEASE_SECONDS:-120}
  # OPENROUTER_API_KEY is not set here: it comes from the repository's .env (env_file below), which `environment`
  # would otherwise override. It is read only in live mode, and never stored.

# The repository's .env (the core's, git-ignored, kept out of the image by Dockerfile.dockerignore), passed to the
# containers at start. Optional: without it, live mode has no key.
x-backend-env-file: &backend-env-file
  - path: ../.env
    required: false

services:
  api:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    env_file: *backend-env-file
    environment: *backend-environment
    volumes:
      - live-cache:/var/lib/expense_api/live-cache
      - compiler-recorded:/var/lib/expense_api/compiler-recorded  # live extractions' model readings
    networks: [internal, public]
    depends_on:
      mongo:
        condition: service_healthy

  # Runs queued evaluations: python -m expense_api.worker. It claims each job atomically in MongoDB, so more than
  # one can run (docker compose up --scale worker=2). It shares live-cache with the API: a live evaluation keeps
  # its answers there, under evaluations/<evaluation_id>, so it can be replayed later.
  worker:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    command: ["python", "-m", "expense_api.worker"]
    env_file: *backend-env-file
    environment: *backend-environment
    volumes:
      - live-cache:/var/lib/expense_api/live-cache
    networks: [internal, public]  # public only for a live run's provider calls
    healthcheck:
      disable: true  # the image's check is the API's HTTP port, which the worker does not serve
    stop_grace_period: 30s  # SIGTERM stops it before its next receipt: a replay job is requeued, a live one fails
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy

  mongo:
    image: mongo:7.0
    volumes:
      - mongo-data:/data/db
    networks: [internal]  # no published port: only the api and the worker reach it
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 20

  mongo-express:
    image: mongo-express:latest
    restart: always
    ports:
      - "8081:8081"
    environment:
      - ME_CONFIG_MONGODB_URL=mongodb://mongo:27017/?directConnection=true
    networks:
      - internal
      - public
    depends_on:
      - mongo

  # The React frontend (../frontend), served by nginx at http://localhost:3000. nginx proxies /api to the api
  # service on the same origin, as the API serves no CORS headers. It reaches only the api, never mongo.
  frontend:
    build:
      context: ../frontend
    ports:
      - "3000:80"
    environment:
      API_UPSTREAM: http://api:8000
    networks: [public]
    depends_on:
      api:
        condition: service_healthy

volumes:
  mongo-data:
  live-cache:
  compiler-recorded:

networks:
  internal:
    internal: true
  public:
