  # A helper can be given a mixture of lines with and without a USD amount, though evaluate_receipts
  # never does: its view blanks them all together. Only the sign of one with none is known.
  - id: a possible alcohol discount with no USD amount leaves the total with no lower bound
    rule_id: ALC-02
    receipt_id: R1
    complete: true
    receipts: [{<<: *meal, submitted_expense_type: Client Entertainment, attendee_count: 2, currency: EUR, fx_rate_to_usd: null, total_amount_usd: null, line_items: [{<<: *line, category: alcohol, unit_price: "65.00", amount: "65.00", amount_usd: "65.00"}, {<<: *line, line_id: L2, category: null, unit_price: "-10.00", amount: "-10.00", amount_usd: null}]}]
    expected: {findings: [], undetermined: [{rule_id: ALC-02, line_id: L2}]}
  - id: a known alcohol discount with no USD amount leaves the total with no lower bound
    rule_id: ALC-02
    receipt_id: R1
    complete: true
    receipts: [{<<: *meal, submitted_expense_type: Client Entertainment, attendee_count: 2, currency: EUR, fx_rate_to_usd: null, total_amount_usd: null, line_items: [{<<: *line, category: alcohol, unit_price: "65.00", amount: "65.00", amount_usd: "65.00"}, {<<: *line, line_id: L2, category: alcohol, unit_price: "-10.00", amount: "-10.00", amount_usd: null}]}]
    expected: {findings: [], undetermined: [{rule_id: ALC-02, line_id: L2}]}
  - id: a charge with no USD amount cannot lower a known alcohol breach
