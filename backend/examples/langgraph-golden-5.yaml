# An evaluation dataset in YAML: one object, with its cases under receipts.
# Each case is a receipt in the core's raw format (data/README.md), with its answers inline as data/receipts.jsonl
# holds them. Every answer is optional: receipt-level labels (disposition; expected_exceptions with review_signals)
# and line-level labels (category, restricted). The answers are split off at upload and never reach the validator.
# context_complete is false: these five receipts are not all of this employee's, so totals spanning receipts stay open.
# Read with a restricted loader: JSON's scalars only, exact decimals, no tags, aliases or repeated keys.
name: langgraph-golden-5
description: The five golden receipts the LangGraph replay set covers, with their answers. Generated from data/receipts.jsonl.
