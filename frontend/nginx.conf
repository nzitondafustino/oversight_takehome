# The single-page app, with /api proxied to the Expense Policy Validator API on the same origin
# (the API serves no CORS headers). ${API_UPSTREAM} is filled in by the nginx image's envsubst at start.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Evaluation datasets may be uploaded through this proxy in a later phase (MAX_DATASET_BYTES is 4 MiB by default).
    client_max_body_size 8m;

    location /api/ {
        proxy_pass ${API_UPSTREAM}/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
